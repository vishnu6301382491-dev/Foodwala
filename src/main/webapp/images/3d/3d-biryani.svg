<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Shadows & 3D Filters -->
    <filter id="handi-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#451a03" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- Clay Handi Pot Gradients -->
    <radialGradient id="clayBody" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="80%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <linearGradient id="clayRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <!-- Saffron Biryani Rice Gradient -->
    <radialGradient id="biryaniRice" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <!-- Egg Gradient -->
    <radialGradient id="eggGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="360" rx="120" ry="22" fill="#000000" opacity="0.25" filter="blur(7px)"/>

  <!-- Steaming Aroma Ribbons -->
  <path d="M 160,130 Q 140,90 160,60" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.45" stroke-linecap="round"/>
  <path d="M 200,120 Q 220,80 195,50" stroke="#ea580c" stroke-width="3.5" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 240,130 Q 260,95 240,65" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.45" stroke-linecap="round"/>

  <g filter="url(#handi-shadow)">
    <!-- 1. Clay Handi Pot Lower Belly -->
    <path d="M 115,220 C 80,260 85,320 135,345 C 170,355 230,355 265,345 C 315,320 320,260 285,220 Z" fill="url(#clayBody)"/>
    
    <!-- Pot Specular Highlight on Left Belly -->
    <path d="M 115,245 C 98,275 105,315 130,332 C 112,315 105,275 125,245 Z" fill="#ffffff" opacity="0.25"/>

    <!-- 2. Pot Neck / Rim Base -->
    <ellipse cx="200" cy="220" rx="105" ry="32" fill="#7c2d12"/>

    <!-- 3. Fluffy Mound of Saffron Dum Biryani Rice -->
    <ellipse cx="200" cy="208" rx="98" ry="36" fill="url(#biryaniRice)"/>

    <!-- Rice Texture Specks & Fried Onions (Barista) -->
    <g fill="#78350f" opacity="0.75">
      <ellipse cx="140" cy="200" rx="5" ry="1.5" transform="rotate(-15, 140, 200)"/>
      <ellipse cx="170" cy="190" rx="6" ry="1.8" transform="rotate(25, 170, 190)"/>
      <ellipse cx="210" cy="188" rx="6" ry="1.6" transform="rotate(-10, 210, 188)"/>
      <ellipse cx="245" cy="198" rx="5" ry="1.5" transform="rotate(30, 245, 198)"/>
      <ellipse cx="180" cy="215" rx="7" ry="1.8" transform="rotate(5, 180, 215)"/>
      <ellipse cx="225" cy="218" rx="6" ry="1.5" transform="rotate(-20, 225, 218)"/>
      <ellipse cx="155" cy="225" rx="5" ry="1.4" transform="rotate(15, 155, 225)"/>
    </g>

    <!-- White Rice Grains Specks -->
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="152" cy="195" rx="4" ry="1.2" transform="rotate(10, 152, 195)"/>
      <ellipse cx="185" cy="196" rx="4" ry="1.2" transform="rotate(-15, 185, 196)"/>
      <ellipse cx="230" cy="192" rx="4" ry="1.2" transform="rotate(20, 230, 192)"/>
      <ellipse cx="202" cy="222" rx="4" ry="1.2" transform="rotate(0, 202, 222)"/>
    </g>

    <!-- 4. Roasted Egg Halve with Golden Yolk -->
    <g>
      <ellipse cx="175" cy="195" rx="22" ry="16" fill="url(#eggGrad)" transform="rotate(-20, 175, 195)"/>
      <!-- Golden Yolk -->
      <ellipse cx="175" cy="195" rx="11" ry="9" fill="#f59e0b" transform="rotate(-20, 175, 195)"/>
      <ellipse cx="173" cy="193" rx="4" ry="3" fill="#fef08a" opacity="0.8"/>
    </g>

    <!-- 5. Fresh Mint Leaves & Green Chili -->
    <path d="M 220,185 C 235,175 245,190 230,196 C 220,192 215,185 220,185 Z" fill="#22c55e"/>
    <path d="M 235,190 C 250,185 255,200 240,205 C 232,200 230,192 235,190 Z" fill="#16a34a"/>
    <!-- Red Chilli Saffron Strand -->
    <path d="M 198,185 Q 206,178 202,170" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- 6. Outer Clay Rim Highlight -->
    <path d="M 98,220 C 98,198 302,198 302,220 C 302,242 98,242 98,220 Z" fill="none" stroke="url(#clayRim)" stroke-width="10"/>
  </g>
</svg>
