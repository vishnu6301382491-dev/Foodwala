<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="platShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.35)"/>
      <stop offset="60%" stop-color="rgba(15,23,42,0.15)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0)"/>
    </radialGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bananaLeaf" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="dosaCrust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="25%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="dosaHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.2)"/>
    </linearGradient>
    <linearGradient id="chutneyWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="chutneyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="bowlSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient shadow -->
  <ellipse cx="200" cy="330" rx="160" ry="40" fill="url(#platShadow)"/>

  <!-- Modern White Plate Base -->
  <ellipse cx="200" cy="270" rx="165" ry="60" fill="url(#plateGrad)"/>
  <ellipse cx="200" cy="265" rx="155" ry="54" fill="#ffffff" opacity="0.8"/>

  <!-- Banana Leaf Cutout -->
  <path d="M 60,265 C 80,225 150,220 220,225 C 290,230 340,245 340,270 C 330,295 270,310 200,310 C 130,310 70,295 60,265 Z" fill="url(#bananaLeaf)"/>
  <!-- Leaf Ribs -->
  <path d="M 60,265 Q 200,270 340,270" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 120,250 L 140,270 M 180,248 L 200,272 M 240,250 L 255,271 M 280,255 L 295,271" stroke="#166534" stroke-width="1.2" opacity="0.35"/>

  <!-- Masala Dosa 3D Roll Cylindrical Body -->
  <!-- Dosa base shadow on leaf -->
  <ellipse cx="200" cy="255" rx="130" ry="22" fill="rgba(21,128,61,0.5)"/>

  <!-- Main Dosa Roll Tube -->
  <g id="dosaRoll" transform="rotate(-6, 200, 235)">
    <!-- Main Cylinder -->
    <path d="M 70,225 C 70,210 85,198 100,198 L 305,198 C 320,198 335,210 335,225 L 325,245 C 315,255 300,260 285,260 L 90,260 C 75,260 65,250 65,240 Z" fill="url(#dosaCrust)"/>
    <!-- Specular Ghee Shimmer / Crust Highlight -->
    <path d="M 85,206 L 315,206 C 320,206 325,214 315,218 L 85,218 C 75,218 80,206 85,206 Z" fill="url(#dosaHighlight)"/>
    <path d="M 110,224 L 295,224 C 302,224 305,230 295,232 L 105,232 C 98,232 102,224 110,224 Z" fill="rgba(255,255,255,0.3)"/>

    <!-- Roasted Golden Dosa Spots / Texture -->
    <ellipse cx="130" cy="216" rx="9" ry="4" fill="#7c2d12" opacity="0.6"/>
    <ellipse cx="180" cy="225" rx="14" ry="5" fill="#7c2d12" opacity="0.5"/>
    <ellipse cx="230" cy="214" rx="12" ry="4" fill="#7c2d12" opacity="0.55"/>
    <ellipse cx="275" cy="222" rx="16" ry="6" fill="#7c2d12" opacity="0.6"/>
    <ellipse cx="155" cy="240" rx="11" ry="4" fill="#9a3412" opacity="0.45"/>
    <ellipse cx="210" cy="242" rx="13" ry="5" fill="#9a3412" opacity="0.4"/>

    <!-- Left Open End of Dosa showing crispy spiral layers & spicy potato masala -->
    <ellipse cx="72" cy="235" rx="14" ry="22" fill="#c2410c"/>
    <ellipse cx="71" cy="235" rx="11" ry="18" fill="#ea580c"/>
    <ellipse cx="70" cy="235" rx="7" ry="13" fill="#eab308"/>
    <!-- Potato chunks / masala texture -->
    <circle cx="69" cy="233" r="2.5" fill="#ca8a04"/>
    <circle cx="71" cy="238" r="2" fill="#15803d"/>
    <circle cx="68" cy="238" r="1.5" fill="#78350f"/>
  </g>

  <!-- 3D Condiment Bowl 1: White Coconut Chutney -->
  <g id="coconutChutney" transform="translate(100, 240)">
    <ellipse cx="30" cy="45" rx="36" ry="12" fill="rgba(0,0,0,0.2)"/>
    <!-- Steel Katori Exterior -->
    <ellipse cx="30" cy="35" rx="34" ry="20" fill="url(#bowlSteel)"/>
    <ellipse cx="30" cy="32" rx="30" ry="16" fill="#64748b"/>
    <!-- Chutney Surface -->
    <ellipse cx="30" cy="30" rx="28" ry="14" fill="url(#chutneyWhite)"/>
    <!-- Tempering (Mustard seeds, curry leaf) -->
    <circle cx="24" cy="29" r="1.8" fill="#0f172a"/>
    <circle cx="35" cy="33" r="1.6" fill="#0f172a"/>
    <circle cx="32" cy="26" r="1.5" fill="#0f172a"/>
    <circle cx="28" cy="34" r="1.5" fill="#0f172a"/>
    <!-- Curry Leaf -->
    <path d="M 22,26 C 26,22 36,25 34,30 C 30,30 25,28 22,26 Z" fill="#16a34a"/>
  </g>

  <!-- 3D Condiment Bowl 2: Fiery Red Chutney / Sambar -->
  <g id="redChutney" transform="translate(230, 245)">
    <ellipse cx="30" cy="45" rx="36" ry="12" fill="rgba(0,0,0,0.2)"/>
    <!-- Steel Katori Exterior -->
    <ellipse cx="30" cy="35" rx="34" ry="20" fill="url(#bowlSteel)"/>
    <ellipse cx="30" cy="32" rx="30" ry="16" fill="#64748b"/>
    <!-- Chutney Surface -->
    <ellipse cx="30" cy="30" rx="28" ry="14" fill="url(#chutneyRed)"/>
    <!-- Oil sheen & spices -->
    <ellipse cx="26" cy="27" rx="12" ry="5" fill="#f87171" opacity="0.6"/>
    <circle cx="34" cy="32" r="1.6" fill="#450a0a"/>
    <circle cx="28" cy="34" r="1.4" fill="#450a0a"/>
  </g>

  <!-- Crispy Butter/Ghee Pat on top of Dosa -->
  <path d="M 188,198 C 192,192 208,192 212,198 C 210,205 190,206 188,198 Z" fill="#fde047" filter="url(#softGlow)"/>
  <ellipse cx="200" cy="197" rx="10" ry="4" fill="#fef08a"/>
  <!-- Melting drip -->
  <path d="M 196,201 Q 198,212 201,212 Q 204,212 205,201 Z" fill="#fde047" opacity="0.85"/>

  <!-- Rising Steam Ribbons -->
  <g opacity="0.6" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 160,185 Q 150,155 165,130 Q 180,105 170,80">
      <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
        M 160,185 Q 150,155 165,130 Q 180,105 170,80;
        M 160,185 Q 170,155 155,130 Q 165,105 160,80;
        M 160,185 Q 150,155 165,130 Q 180,105 170,80"/>
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.2;0.7;0.2"/>
    </path>
    <path d="M 230,180 Q 240,150 225,125 Q 215,100 230,75">
      <animate attributeName="d" dur="3.5s" repeatCount="indefinite" values="
        M 230,180 Q 240,150 225,125 Q 215,100 230,75;
        M 230,180 Q 220,150 235,125 Q 230,100 220,75;
        M 230,180 Q 240,150 225,125 Q 215,100 230,75"/>
      <animate attributeName="opacity" dur="3.5s" repeatCount="indefinite" values="0.3;0.8;0.3"/>
    </path>
  </g>
</svg>
