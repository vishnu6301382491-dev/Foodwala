<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Shadows & 3D Filters -->
    <filter id="burger-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#7c2d12" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="layer-depth" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#451a03" flood-opacity="0.25"/>
    </filter>

    <!-- Bun Gradients -->
    <radialGradient id="topBunGlow" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="35%" stop-color="#fba858"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <linearGradient id="bottomBunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fba858"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Patty Gradient -->
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2e17"/>
      <stop offset="40%" stop-color="#3d1d0e"/>
      <stop offset="80%" stop-color="#2a1208"/>
      <stop offset="100%" stop-color="#1c0b05"/>
    </linearGradient>

    <!-- Cheese Gradient -->
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Lettuce Gradient -->
    <linearGradient id="lettuceGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="85%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Tomato Gradient -->
    <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="90%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="200" cy="355" rx="130" ry="24" fill="#000000" opacity="0.22" filter="blur(8px)"/>
  <ellipse cx="200" cy="350" rx="95" ry="16" fill="#000000" opacity="0.28" filter="blur(4px)"/>

  <!-- BURGER GROUP WITH 3D POP -->
  <g filter="url(#burger-shadow)">
    
    <!-- 1. Bottom Bun -->
    <g id="bottom-bun">
      <path d="M 95,290 C 95,275 305,275 305,290 C 305,330 260,345 200,345 C 140,345 95,330 95,290 Z" fill="url(#bottomBunGrad)"/>
      <ellipse cx="200" cy="285" rx="104" ry="12" fill="#fde68a" opacity="0.4"/>
    </g>

    <!-- 2. Grilled Patty with Texture -->
    <g id="patty" filter="url(#layer-depth)">
      <path d="M 82,260 C 82,246 318,246 318,260 C 322,284 300,296 200,296 C 100,296 78,284 82,260 Z" fill="url(#pattyGrad)"/>
      <!-- Grill marks -->
      <path d="M 120,264 Q 135,272 150,264 M 175,263 Q 190,272 205,263 M 230,264 Q 245,272 260,264" stroke="#1f0e06" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- 3. Melting Cheddar Cheese (Overhanging Dripping Edges) -->
    <g id="cheese" filter="url(#layer-depth)">
      <path d="M 85,248 L 130,250 L 145,282 L 165,249 L 235,250 L 255,286 L 275,248 L 315,248 C 318,258 290,268 200,268 C 110,268 82,258 85,248 Z" fill="url(#cheeseGrad)"/>
      <!-- Melt highlights -->
      <path d="M 143,260 L 145,276" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 253,262 L 255,280" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- 4. Fresh Ripe Tomatoes -->
    <g id="tomatoes" filter="url(#layer-depth)">
      <ellipse cx="145" cy="236" rx="55" ry="14" fill="url(#tomatoGrad)"/>
      <ellipse cx="255" cy="236" rx="55" ry="14" fill="url(#tomatoGrad)"/>
      <ellipse cx="145" cy="234" rx="46" ry="9" fill="#fca5a5" opacity="0.6"/>
      <ellipse cx="255" cy="234" rx="46" ry="9" fill="#fca5a5" opacity="0.6"/>
    </g>

    <!-- 5. Crispy Ruffled Lettuce -->
    <g id="lettuce" filter="url(#layer-depth)">
      <path d="M 70,225 C 85,210 100,235 125,220 C 150,205 165,230 195,218 C 225,206 245,232 275,218 C 305,204 315,230 330,225 C 335,238 310,246 200,248 C 90,246 65,238 70,225 Z" fill="url(#lettuceGrad)"/>
      <!-- Lettuce Leaf Folds -->
      <path d="M 85,224 Q 100,216 115,226 M 150,220 Q 170,212 185,224 M 235,218 Q 255,210 270,222 M 295,220 Q 310,214 322,226" stroke="#bbf7d0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 6. Golden 3D Top Bun (Glossy & Volumetric) -->
    <g id="top-bun">
      <path d="M 80,210 C 75,100 325,100 320,210 C 320,224 80,224 80,210 Z" fill="url(#topBunGlow)"/>
      
      <!-- Specular Light Reflection Curve -->
      <path d="M 115,150 C 130,120 220,110 280,135 C 250,120 160,120 115,150 Z" fill="#ffffff" opacity="0.38"/>

      <!-- 3D White/Golden Sesame Seeds -->
      <!-- Row 1 -->
      <ellipse cx="150" cy="142" rx="4" ry="2.2" fill="#fef3c7" transform="rotate(-15, 150, 142)"/>
      <ellipse cx="195" cy="132" rx="4" ry="2.2" fill="#fef3c7" transform="rotate(5, 195, 132)"/>
      <ellipse cx="245" cy="145" rx="4" ry="2.2" fill="#fef3c7" transform="rotate(22, 245, 145)"/>
      <!-- Row 2 -->
      <ellipse cx="130" cy="170" rx="4" ry="2.2" fill="#fef3c7" transform="rotate(-30, 130, 170)"/>
      <ellipse cx="170" cy="160" rx="4" ry="2.2" fill="#fef3c7" transform="rotate(-5, 170, 160)"/>
      <ellipse cx="220" cy="158" rx="4" ry="2.2" fill="#fef3c7" transform="rotate(12, 220, 158)"/>
      <ellipse cx="265" cy="172" rx="4" ry="2.2" fill="#fef3c7" transform="rotate(28, 265, 172)"/>
      <!-- Row 3 -->
      <ellipse cx="155" cy="188" rx="4" ry="2.2" fill="#fef3c7" transform="rotate(-10, 155, 188)"/>
      <ellipse cx="202" cy="184" rx="4" ry="2.2" fill="#fef3c7" transform="rotate(0, 202, 184)"/>
      <ellipse cx="248" cy="189" rx="4" ry="2.2" fill="#fef3c7" transform="rotate(18, 248, 189)"/>
    </g>

  </g>
</svg>
