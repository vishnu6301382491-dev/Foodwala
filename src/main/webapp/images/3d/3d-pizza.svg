<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Shadows & 3D Filters -->
    <filter id="pizza-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#7c2d12" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="pep-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#450a0a" flood-opacity="0.45"/>
    </filter>

    <!-- Crust Gradient -->
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Cheese Melt Gradient -->
    <radialGradient id="cheeseMelt" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="90%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Tomato Sauce Underlayer -->
    <radialGradient id="sauceGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <!-- Pepperoni Gradient -->
    <radialGradient id="pepGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <!-- Basil Leaves Gradient -->
    <linearGradient id="basilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadows -->
  <ellipse cx="200" cy="355" rx="145" ry="32" fill="#000000" opacity="0.2" filter="blur(8px)"/>
  <ellipse cx="200" cy="348" rx="110" ry="22" fill="#000000" opacity="0.25" filter="blur(4px)"/>

  <g filter="url(#pizza-shadow)">
    <!-- 1. Thick Woodfired Crust (Isometric Circle) -->
    <ellipse cx="200" cy="235" rx="155" ry="95" fill="url(#crustGrad)"/>
    <!-- Outer Raised Crust Rim -->
    <path d="M 45,235 C 45,140 355,140 355,235 C 355,330 45,330 45,235 Z" fill="none" stroke="#b45309" stroke-width="14" opacity="0.85"/>
    <path d="M 52,228 C 52,148 348,148 348,228" fill="none" stroke="#fde68a" stroke-width="4" opacity="0.6"/>

    <!-- 2. Rich Marinara Base -->
    <ellipse cx="200" cy="235" rx="140" ry="82" fill="url(#sauceGrad)"/>

    <!-- 3. Bubbling Melted Mozzarella Cheese -->
    <ellipse cx="200" cy="235" rx="134" ry="76" fill="url(#cheeseMelt)"/>

    <!-- Golden browned cheese patches -->
    <ellipse cx="160" cy="210" rx="22" ry="12" fill="#b45309" opacity="0.32" filter="blur(2px)"/>
    <ellipse cx="245" cy="245" rx="26" ry="14" fill="#b45309" opacity="0.3" filter="blur(2px)"/>
    <ellipse cx="190" cy="265" rx="18" ry="10" fill="#b45309" opacity="0.28" filter="blur(2px)"/>
    <ellipse cx="225" cy="195" rx="16" ry="9" fill="#b45309" opacity="0.3" filter="blur(2px)"/>

    <!-- 4. Pepperoni Slices with 3D Depth -->
    <g filter="url(#pep-shadow)">
      <!-- Slice 1 (Top Left) -->
      <ellipse cx="140" cy="195" rx="22" ry="13" fill="url(#pepGrad)"/>
      <ellipse cx="140" cy="194" rx="18" ry="10" fill="#ef4444" opacity="0.6"/>
      <circle cx="136" cy="193" r="1.5" fill="#fecaca"/>
      <circle cx="144" cy="196" r="1.5" fill="#fecaca"/>

      <!-- Slice 2 (Center) -->
      <ellipse cx="205" cy="225" rx="24" ry="14" fill="url(#pepGrad)"/>
      <ellipse cx="205" cy="224" rx="20" ry="11" fill="#ef4444" opacity="0.6"/>
      <circle cx="201" cy="223" r="1.5" fill="#fecaca"/>
      <circle cx="210" cy="227" r="1.5" fill="#fecaca"/>

      <!-- Slice 3 (Top Right) -->
      <ellipse cx="258" cy="198" rx="21" ry="12" fill="url(#pepGrad)"/>
      <ellipse cx="258" cy="197" rx="17" ry="9" fill="#ef4444" opacity="0.6"/>

      <!-- Slice 4 (Bottom Left) -->
      <ellipse cx="155" cy="255" rx="23" ry="13" fill="url(#pepGrad)"/>
      <ellipse cx="155" cy="254" rx="19" ry="10" fill="#ef4444" opacity="0.6"/>

      <!-- Slice 5 (Bottom Right) -->
      <ellipse cx="250" cy="260" rx="22" ry="13" fill="url(#pepGrad)"/>
      <ellipse cx="250" cy="259" rx="18" ry="10" fill="#ef4444" opacity="0.6"/>

      <!-- Slice 6 (Far Edge) -->
      <ellipse cx="102" cy="232" rx="19" ry="11" fill="url(#pepGrad)"/>
      <ellipse cx="295" cy="230" rx="19" ry="11" fill="url(#pepGrad)"/>
    </g>

    <!-- 5. Fresh Basil Leaves & Herbs -->
    <g>
      <!-- Basil Leaf 1 -->
      <path d="M 175,200 C 160,195 165,180 185,182 C 195,195 185,205 175,200 Z" fill="url(#basilGrad)" filter="url(#layer-depth)"/>
      <path d="M 172,196 Q 178,190 183,184" stroke="#86efac" stroke-width="1.2" fill="none"/>

      <!-- Basil Leaf 2 -->
      <path d="M 230,215 C 245,210 240,195 220,198 C 215,210 222,220 230,215 Z" fill="url(#basilGrad)" filter="url(#layer-depth)"/>

      <!-- Basil Leaf 3 -->
      <path d="M 190,248 C 175,245 180,230 200,234 C 205,245 198,252 190,248 Z" fill="url(#basilGrad)" filter="url(#layer-depth)"/>
    </g>
  </g>
</svg>
